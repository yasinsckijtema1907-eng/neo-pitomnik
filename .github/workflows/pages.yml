name: Publish nursery editions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import the verified original-site update
        if: ${{ hashFiles('original-nursery-update.zip') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path
          from zipfile import ZipFile
          from subprocess import run

          root = Path.cwd().resolve()
          archive = root / 'original-nursery-update.zip'
          expected = {'README.md': ('b8798e79961203f321b5c3c9783655c1a765259946ffca95f44af2ccd9f8d06f', '53b0955c6c40b404ae802f021bd095de34e10f25'), 'app/2017/05/29/[slug]/page.tsx': ('ae40d6e3a9a04f6985291d954c90e0881028d977a5b91a17e738fbc2063448ad', '14c206b6ea32a2de28700c7533b843ac173cc626'), 'app/about-team.tsx': ('b6d1e374ae273eea5ed859b9afbee8706afd06ca19bbafa1aad49078a74f4983', 'cd42ee8cbcc734ded50feb1c74d150160dac81c7'), 'app/blog/[slug]/page.tsx': ('45dbb7e73ea117c0eb9851a7affa86de7624a22033c9aa8d7dd04dc9ad1d0351', '8cb97574271f596ea3b6d5f90edfe1e15fc86747'), 'app/blog/page.tsx': ('b6afdfecba958a97a18ded93e50e714917baf0c7ec1e8af63972050d6e467cd9', '2fa5ca6533e3992c42c0cab1eeff4cc498d1fbfe'), 'app/data/original.json': ('c2b59120fec77c12db7f95bec4a759a5e9e9ad7ed2730380a522542c58831c39', None), 'app/garden.tsx': ('a4fa57e21e748f9e972e834bee7ebf733dc5a94d04bad3498cc690a5352ef9c5', '967b1fe4aabf2f3296375f4374b1f1cffe3cd992'), 'app/korzina/page.tsx': ('c4383d2d2961499930524e883e472957ff82eb8717776f1a92f63ed506bb5c5d', '8319746c858912310a30a26682a54e0bd63769b1'), 'app/nov-commerce.tsx': ('9a2a38b9f1c8b54d1701dc5ea1c0e27c63a32aef63857f8152a96ea194237bff', '07cc3bf084d98341c7f8c3b464809aedb0048ad4'), 'app/nov-editions.css': ('a7ac6ab7a554b7b9d44ad9f8dd1769df5991f076368ceac405b06c8650514f40', 'd7702d57f2c22a99e841aa15450188b9be016cc4'), 'app/nov-editorial.tsx': ('f8ac70ef190118e25c55370340d4fdb99ef38d1519c3be93278ef9b7ab11b667', '803ef282e9435675cae2cd782b18bc08d80b7c59'), 'app/nov-shop-tools.ts': ('3611854cd0a33306ac599787aae0a5ef8fdc929cb01f28752282a3266d682f77', '3d6afb19980b855368bc7ab0a41c741dd8e1771c'), 'app/o-nas/page.tsx': ('9a9f2386289f025150fa2fe59658765a3345f6f2eaddc1d83c5883b96cff80c6', '5e2581e084ac43e82cdeae54ad65749b3c2f12e9'), 'app/page-content.tsx': ('95c12108a4b59f6db3640374cf20791a51d15fb853c33abd75ed2381d6ff8454', 'f9cdea47570f7e5910bcfbfb2f06c427305ad049'), 'app/page.tsx': ('adbef3c83eb22bcb3e3dc968ea2cfbb4947064ac84eb8e674f2a3b4759bd0fca', '159374d519f4403919254230bbccabfdce78bf87'), 'app/premium-experience.tsx': ('f88bccbf178c43188a9d3f00bcf6bdad3d7347228c2c51abb53187c1272a30d1', '085ae12589de7bb8e95ec32b575133976118a75b'), 'app/shop/page/[page]/page.tsx': ('53a18b2082bed13212dd491f9876c5ce1deea58ff1dca5187ea02e2109c58499', None), 'app/site-types.ts': ('4c9c31d7d399590543a987316e1cb4f66a12165f39df4a856d97e7324da0d542', 'b5f382439f8f96cb31208975c831e54cb0e125cb'), 'app/sitemap.ts': ('414f916576553af8966b87cc3a2cd129f31cdf1bdfe3f1a7dba2de3b2686733e', '6178267bd9e88cdf36682e1b96428323f50b21e2'), 'public/assets/original-services/avtopoliv.webp': ('22aceb41f4fa3c837c39df799f51a38c3c7687da35565ad8bd3717d3a8b7f53a', None), 'public/assets/original-services/konsultaciya-agronoma.webp': ('304ffc8e1bd81a397baf05b70dd0cbd9f99cd1f888ffabe5d0da666b701fea81', None), 'public/assets/original-services/obrabotka-sada.webp': ('2461f4e1e7cc26909cd20f84f4fdcfb4e1d21f061616a7c3c0875fe48e9cab0c', None), 'public/assets/original-services/peresadka-krupnomerov.webp': ('ac7add67fd5b9ca2517a98c0b7eb04b7f805439ea9d0ca1cc652b9963450f934', None), 'public/assets/original-services/planirovanie-uchastka.webp': ('31314a3ad53f07525305839960b4a10eaa2789f611b16fc49b32dfd64cda333d', None), 'public/assets/original-services/posadka-rasteniy.webp': ('926b870d15997a39b22931b46652f17fd51459e7cf6095d6f712c167c637eb17', None), 'public/assets/original-services/servisnyy-uhod.webp': ('59d5030683837a7eb8ea8024ead64124bff5c02864cc33fd372a57f2c9815c8f', None), 'public/assets/original-services/sources.json': ('5f5dd6f57a6a2b931d36dc5eaa5132a894fd5b81640dc60cbf5db63f17da769f', None), 'public/blog.json': ('66ebd3969df7309feb7f49a023c985b799a21dd08d851ff92ab83c14c66d183b', '33e1f76ed6376e1015f3e1377431eef94d02c244'), 'public/catalog.json': ('73a9d8651b2894c3c908878b804cb54d288bf77893d8e3e188353ca8e57960ca', '71d4230bc1cedd27e7dd83a3f57cbd73a9419057')}
          deleted = {'app/legacy-redirect.tsx': 'c4c7523a8d9eea096e39d95ad0fb2a25c2f1e576'}
          if sha256(archive.read_bytes()).hexdigest() != 'f95131d49da2e9b9416318c8e679286fa8b955ef651ffc164fde542ede18371c':
              raise RuntimeError('The update archive differs from the verified package')

          def checked_target(name, before):
              target = root / name
              if not target.resolve().is_relative_to(root):
                  raise RuntimeError('Unexpected target: ' + name)
              if before is None:
                  if target.exists():
                      raise RuntimeError('A new file already exists: ' + name)
              else:
                  data = target.read_bytes()
                  if sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != before:
                      raise RuntimeError('Source changed during preparation: ' + name)
              return target

          changes = {}
          with ZipFile(archive) as bundle:
              if set(bundle.namelist()) != set(expected) or len(bundle.namelist()) != len(expected):
                  raise RuntimeError('Unexpected files in the update archive')
              for name, (digest, before) in expected.items():
                  target = checked_target(name, before)
                  data = bundle.read(name)
                  if sha256(data).hexdigest() != digest:
                      raise RuntimeError('Unexpected file contents: ' + name)
                  changes[target] = data
          removals = [checked_target(name, before) for name, before in deleted.items()]
          for target, data in changes.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          for target in removals:
              target.unlink()
          archive.unlink()
          if (root / '.git').exists():
              run(['git','--literal-pathspecs','add','-A','--',*expected,*deleted,archive.name],check=True)
          print(f'Imported {len(changes)} verified source files.')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and validate both editions
        env:
          NEXT_PUBLIC_BASE_PATH: /neo-pitomnik
          NEXT_PUBLIC_SITE_ORIGIN: https://yasinsckijtema1907-eng.github.io
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run build:pages
          cmp public/catalog.json out/catalog.json
          cmp out/catalog.json out/plus/catalog.json
          for folder in out out/plus; do
            test -f "$folder/shop/page/16/index.html"
            test -f "$folder/sale/index.html"
            test -f "$folder/2017/05/29/kak-vybrat-tuyu-dlya-zhivoy-izgorodi/index.html"
            test -f "$folder/assets/trees/conifer-growth-4k.glb"
          done
          test -f out/plus/price-list.csv

      - name: Save the verified source
        shell: bash
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild both nursery editions from the original site'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both website editions
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
