name: Publish nursery editions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import verified owner and expanded editions
        if: ${{ hashFiles('nov-editions-update.zip') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path.cwd().resolve()
          archive = root / 'nov-editions-update.zip'
          expected = {'.gitignore': ('ce40dd09debc2ad8aad3d5cd1a393f84d9583ae71eb5b17e22b7100d019b78e3', '7df104ab24525748b7a123c52739edcce8856c3d'), 'README.md': ('06795f958c5af6b627f4aeee9b54e842bad0dba79e19ddd8c89471935ae76201', '0a2b3cb556e26928f26ed92449bd66770b4cd755'), 'app/blog/page.tsx': ('4496dc1fd4586fc56698c897f639222535bde0cfb624fac81a824bef9294c59b', '386bd86e940d1d32757db477acff9da5a3ee0476'), 'app/garden.tsx': ('671ecd2cf0354a22591400189ff6d57b72be7ff5310230543bee1b6abddb1d29', 'aa278b4f4bbd64aa3790026d76778e5922e59670'), 'app/layout.tsx': ('0947dc2cc5e3fd78b9f4f1332bd036a411ece7b572a63e4eecac70abfd641f20', '7b8a939a7d85409f9ae97948e9bfdcfdb6e31e6a'), 'app/nov-commerce.tsx': ('b79d4bf0734c311cb55b4fb32fc04924620aadd3c51c550a4dbe533719983ff6', None), 'app/nov-editions.css': ('5317a1eca0bf0ee69c496a19d213db00b1b34f68d0a563839a5f14a1a234eff0', None), 'app/nov-editorial.tsx': ('a40226a29c0c0cafffb8fc3221f3d2c5ba609bbdf9a0dd03a05e7f855da493fd', None), 'app/nov-shop-tools.ts': ('d176d88b4ee14ef2eb309a569cea7771db50de30ef51910ad2203d54695a0fbf', None), 'app/o-nas/page.tsx': ('0baca26687e2632194205ad20b76a28f4b96b2b47441b2d026d7883ad5f33219', 'ea32076900ce61e24f3a5255079c59e5741b919a'), 'app/page.tsx': ('1f0b2573647b94e5e792d7b4d1d5c65014ea0c63abd3f0fe10467fdea45b2c55', '036ebf163183710a99c478c816d0156e96631e39'), 'app/pokupatelyam/page.tsx': ('821254f3a54beedc2e613b3c3a021bca5b112f83954faf9b68fde74755505d13', None), 'app/premium-experience.tsx': ('a9e379f84190e6a5a7bca4a33fa050cfac6f979e47aaf5d04eb408b3f7b3fadf', '19527f0ee5356ab42fa7039ca8829fe6dca8e26c'), 'app/site-types.ts': ('ca1d49de6d73d74066432462e2ba21c4db1b43715cdd8d12dfe3f6ca7d89b0c1', '4cd1926261dc67fec610f20d449d96a1ab8ede66'), 'app/sitemap.ts': ('0a62f67d55c2f7d163c8317a8d0d6ce074b91620763d2b5a311c41b5a1aa398d', 'a14fc524b2e86074db8149813111682ab7e9fb70'), 'docs/competitive-notes.md': ('ed7797fa4e910929a77f2b20be212433ec2eb1806adb1ae27c2fdf80f4a01f29', None), 'package.json': ('cbe0e3a854f07d9efb28de8e103e0dd96787a3923ee5e1567b41c31b00889880', '0889dd4787f20327e9e31968eb8209c98eee90d5'), 'public/assets/garden-map/conifers-472.webp': ('1dce41224e2d296aa478f32a0d249aabcc1564c2dedb04bd0c4f2866432988e7', None), 'public/assets/garden-map/conifers.webp': ('49c935b08c6e0984e4a223e8038d8375f1e2fae4bce024f75c28b4b0b7f2f953', None), 'public/assets/garden-map/deciduous-472.webp': ('da569b9e5ac1c1426598367fe488f3beef7614bbb6f081803a5bbb8f34f48e10', None), 'public/assets/garden-map/deciduous.webp': ('ba843c0bd3e14458d97b4882e230ad80ec8d6698500c2e1af82b77085b75db16', None), 'public/assets/garden-map/flowers-472.webp': ('65b3ff946ad87d5aba320e3e156771df4b017720e651d24094e207fa1ddc4b5a', None), 'public/assets/garden-map/flowers.webp': ('83b06db6c96d5524da0547ef0f1ff56bf740a3d19af2beff762e7dccb6eb00ae', None), 'public/assets/garden-map/fruit-472.webp': ('58fd2ea8be47a35d650a354a6dbd67153cb20dec0ede2c24e183e528a00fb681', None), 'public/assets/garden-map/fruit.webp': ('fbdbe79dd7370be14b5ae29af132394dcb3bbb695f430fcc921172778238e6a8', None), 'public/assets/garden-map/sources.json': ('5bb698a80c4ad255c2a61fa886cd2f8c05dde52a08f93e8dd45d77306650cba3', None), 'scripts/build-editions.mjs': ('6223e2324b27897fd52f267d528c7d5f1c5a5f69c44097f83d4f04406407dfbf', None)}
          if hashlib.sha256(archive.read_bytes()).hexdigest() != '2aa375e0b52d5c046dcc2be5cb6c611e38580202599164b0904b079c9d657dc0':
              raise RuntimeError('Edition update archive failed verification')
          staged = {}
          with zipfile.ZipFile(archive) as bundle:
              if set(bundle.namelist()) != set(expected) or len(bundle.namelist()) != len(expected):
                  raise RuntimeError('Unexpected edition files')
              for name, (digest, base_blob) in expected.items():
                  target = root / name
                  if not target.resolve().is_relative_to(root):
                      raise RuntimeError('Invalid path: ' + name)
                  new = bundle.read(name)
                  if hashlib.sha256(new).hexdigest() != digest:
                      raise RuntimeError('Invalid contents: ' + name)
                  if base_blob is None:
                      if target.exists():
                          raise RuntimeError('An added file already exists: ' + name)
                  else:
                      old = target.read_bytes()
                      git_blob = hashlib.sha1(b'blob ' + str(len(old)).encode() + b'\0' + old).hexdigest()
                      if git_blob != base_blob:
                          raise RuntimeError('Source changed during preparation: ' + name)
                  staged[target] = new
          for target, data in staged.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          archive.unlink()
          print('Imported both editions. Existing catalog and 4K assets were not modified.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign nursery panorama and add expanded shopping edition'
          git push origin HEAD:main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build both website editions
        env:
          NEXT_PUBLIC_BASE_PATH: /neo-pitomnik
          NEXT_PUBLIC_SITE_ORIGIN: https://yasinsckijtema1907-eng.github.io
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run build:pages
          cmp public/catalog.json out/catalog.json
          cmp out/catalog.json out/plus/catalog.json
          test -f out/assets/trees/conifer-growth-4k.glb
          test -f out/plus/assets/trees/conifer-growth-4k.glb

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both website editions
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
